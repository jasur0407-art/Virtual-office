<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGO 900 Interlude</title>
<meta name="description" content="EGO 900: Lineage II Interlude server. EXP x300, har kuni TvT, CvC, osada va epik bosslar.">
<meta name="theme-color" content="#120e0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: one centered column of "stone" bands; game-UI panels with bronze double frames carry the data. */
:root {
  --night: #110d09;
  --stone: #1a140f;
  --stone-2: #241c15;
  --bronze: #7d6037;
  --gold: #d6b066;
  --gold-hi: #f2dba0;
  --parch: #ebdfc4;
  --muted: #a6977c;
  --blood: #a3362a;
  --ok: #78b562;
  --warn: #d89a3c;
  --f-display: "Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-quote: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--night);
  color: var(--parch);
  font: 400 17px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--night);
}
img { max-width: 100%; }
a { color: var(--gold); }
a:hover { color: var(--gold-hi); }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap.narrow { max-width: 820px; }

/* Demo notice */
.demo-ribbon {
  background: repeating-linear-gradient(135deg, #3a1c14 0 14px, #2d150f 14px 28px);
  color: var(--gold-hi); text-align: center; font-size: 14px;
  padding-block: 6px; padding-inline: 16px; border-bottom: 1px solid var(--bronze);
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: linear-gradient(#1b140e, #120d09);
  border-bottom: 1px solid var(--bronze);
  box-shadow: 0 1px 0 #00000080, 0 6px 18px #00000066;
}
.top-in { display: flex; align-items: center; gap: 20px; min-height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--gold-hi); }
.logo-mark { font-size: 22px; color: var(--gold); text-shadow: 0 0 10px #d6b06688; }
.logo-text { display: flex; flex-direction: column; line-height: 1.05; }
.logo-text b { font: 400 22px var(--f-display); letter-spacing: .06em; }
.logo-text small { font-size: 12px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.nav a {
  color: var(--parch); text-decoration: none; padding: 8px 10px;
  font: 400 15px var(--f-display); letter-spacing: .05em; border-radius: 2px;
}
.nav a:hover, .nav a.active { color: var(--gold-hi); background: #d6b0661a; }
.lang { display: flex; margin-left: 8px; border: 1px solid var(--bronze); }
.lang button {
  background: transparent; color: var(--muted); border: 0; padding: 6px 10px; cursor: pointer;
  font: 700 13px var(--f-body); letter-spacing: .08em;
}
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--night); }
.burger { display: none; margin-left: auto; background: none; border: 1px solid var(--bronze); padding: 9px 8px; cursor: pointer; }
.burger span { display: block; width: 22px; height: 2px; background: var(--gold); margin: 4px 0; transition: transform .2s, opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* Hero */
.hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 38%, #5a2a1666, transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 110%, #00000099, transparent 60%),
    linear-gradient(#1c130d, var(--night));
  border-bottom: 1px solid var(--bronze);
}
.embers { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-in { position: relative; z-index: 1; text-align: center; padding-block: 72px 56px; }
.eyebrow { margin: 0; font: 400 14px var(--f-display); letter-spacing: .32em; color: var(--gold); text-transform: uppercase; }
.hero-title {
  margin: 10px 0 6px; font: 400 clamp(54px, 12.5vw, 140px)/1 var(--f-display); white-space: nowrap; letter-spacing: .04em;
  background: linear-gradient(180deg, #fff3cf 0%, var(--gold) 48%, #8d6a32 52%, #e8c77e 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #00000099) drop-shadow(0 0 28px #c9822f55);
}
.hero-sub { margin: 0 auto; max-width: 34em; font: italic 500 clamp(19px, 2.6vw, 24px)/1.4 var(--f-quote); color: var(--parch); text-wrap: balance; }
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; min-height: 48px; text-decoration: none; cursor: pointer;
  font: 400 17px var(--f-display); letter-spacing: .08em; border-radius: 2px;
  transition: filter .15s, transform .15s;
}
.btn:active { transform: translateY(1px); }
.btn-gold {
  color: #1d1208; border: 1px solid #f6e1a8;
  background: linear-gradient(#f1d68f, #c39443 55%, #9c7230);
  box-shadow: inset 0 1px 0 #fff6d4, 0 0 0 1px #3d2a12, 0 6px 16px #00000080;
}
.btn-gold:hover { filter: brightness(1.08); color: #1d1208; }
.btn-ghost { color: var(--gold-hi); border: 1px solid var(--bronze); background: #00000055; }
.btn-ghost:hover { background: #d6b0661f; color: var(--gold-hi); }
.btn.full { width: 100%; }

/* Panel: game-UI frame */
.panel {
  position: relative; background: linear-gradient(#211912ee, #17110ced);
  border: 1px solid var(--bronze);
  box-shadow: inset 0 0 0 3px #110d09, inset 0 0 0 4px #4a3920, 0 10px 24px #00000080;
  padding: 22px;
}
.panel::before, .panel::after {
  content: "◆"; position: absolute; font-size: 10px; color: var(--gold); line-height: 1;
}
.panel::before { top: -6px; left: -5px; }
.panel::after { bottom: -6px; right: -5px; }
.panel-h { margin: 0 0 12px; font: 400 18px var(--f-display); color: var(--gold-hi); letter-spacing: .08em; }

.status { margin: 44px auto 0; max-width: 760px; display: grid; grid-template-columns: 1fr 1fr 1.9fr; gap: 0; padding: 0; text-align: left; }
.status-cell { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid #4a392080; min-width: 0; }
.status-cell:last-child { border-right: 0; }
.label { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.pill.on { color: var(--ok); }
.pill.off { color: var(--blood); }
.pill.soon { color: var(--warn); }
.num, .countdown { font: 400 22px var(--f-display); color: var(--gold-hi); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.countdown { white-space: nowrap; }

/* Sections */
.sec { padding-block: 72px; border-bottom: 1px solid #4a392066; }
.sec-dark { background: linear-gradient(var(--stone), #140f0b); }
.sec-title {
  margin: 0 0 10px; text-align: center; font: 400 clamp(28px, 4.5vw, 40px)/1.15 var(--f-display);
  color: var(--gold-hi); letter-spacing: .06em; text-wrap: balance;
  display: flex; align-items: center; justify-content: center; gap: 16px;
}
.sec-title::before, .sec-title::after {
  content: ""; flex: 0 1 90px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold));
}
.sec-title::after { transform: scaleX(-1); }
.sec-title.left { justify-content: flex-start; }
.sec-title.left::before { display: none; }
.sec-lead { margin: 0 auto 36px; max-width: 40em; text-align: center; color: var(--muted); text-wrap: balance; }

/* Rates */
.server-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
.table-panel { min-width: 0; }
.tbl-scroll { overflow-x: auto; }
.rates { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rates th, .rates td { padding: 9px 6px; border-bottom: 1px solid #4a392080; text-align: left; }
.rates tr:last-child th, .rates tr:last-child td { border-bottom: 0; }
.rates th { font-weight: 500; color: var(--parch); }
.rates td { text-align: right; font: 400 18px var(--f-display); color: var(--gold-hi); white-space: nowrap; }
.rates td.tbd { color: var(--muted); font: italic 15px var(--f-body); }

.features { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #4a392066; border: 1px solid #4a392066; }
.features li { background: var(--night); padding: 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.features b { font: 400 18px var(--f-display); color: var(--gold); letter-spacing: .04em; }
.features span { color: var(--muted); font-size: 15px; }

/* Schedule */
.sch-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items: start; }
.sch-grid > * { min-width: 0; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 7.2em 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid #4a392080; }
.timeline li:last-child { border-bottom: 0; }
.timeline time { font: 400 17px var(--f-display); color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timeline span { display: flex; flex-direction: column; min-width: 0; }
.timeline small { color: var(--muted); font-size: 14px; }
.weekly { width: 100%; border-collapse: collapse; }
.weekly th, .weekly td { padding: 9px 6px; text-align: left; border-bottom: 1px solid #4a392080; }
.weekly thead th { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.weekly tbody th { font-weight: 500; }
.weekly td { color: var(--gold-hi); font-family: var(--f-display); }
.weekly td.muted { color: var(--muted); font: italic 15px var(--f-body); }
.weekly tr.today { background: #d6b0661a; }
.weekly tr.today th { color: var(--gold-hi); }
.weekly em { font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--night); background: var(--gold); padding: 1px 6px; margin-left: 4px; }
.panel-note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.ev-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 24px; margin-top: 32px; }
.ev-card { border-top: 2px solid var(--bronze); padding-top: 12px; min-width: 0; }
.ev-card b { font: 400 20px var(--f-display); color: var(--gold-hi); }
.ev-card .plist li { color: var(--muted); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plist li { padding-left: 20px; position: relative; }
.plist li::before { content: "◆"; position: absolute; left: 0; top: .15em; font-size: 10px; color: var(--gold); }
.ev-card .plist { margin-top: 10px; font-size: 15px; }
.next-name { color: var(--gold-hi); font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: 14px; }

/* PvP, chests */
.two-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: start; }
.chests { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
.two-col > *, .chests > * { min-width: 0; }
.chest-side { display: grid; gap: 24px; }
.price-tbl { width: 100%; border-collapse: collapse; margin: 6px 0 16px; font-variant-numeric: tabular-nums; }
.price-tbl th, .price-tbl td { padding: 9px 6px; border-bottom: 1px solid #4a392080; text-align: left; white-space: nowrap; }
.price-tbl tr:last-child th, .price-tbl tr:last-child td { border-bottom: 0; }
.price-tbl th { font-weight: 500; }
.price-tbl td { font: 400 19px var(--f-display); color: var(--gold-hi); }
.price-tbl td small { font: 400 13px var(--f-body); color: var(--muted); }
.price-tbl td.or { font: italic 14px var(--f-body); color: var(--muted); }
.timeline li.reset time, .timeline li.reset b { color: var(--muted); }
.chest { display: flex; flex-direction: column; gap: 6px; }
.chest .panel-h { font-size: 22px; }
.chest .price { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid #4a392080; font: 400 19px var(--f-display); color: var(--gold); }
.is-off { opacity: .6; cursor: default; }

/* Steps */
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.steps li { counter-increment: s; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.steps li::before {
  content: counter(s, upper-roman); width: 52px; height: 52px; display: grid; place-items: center;
  font: 400 20px var(--f-display); color: var(--gold-hi); margin: 6px 0 14px 6px;
}
.steps li::after {
  content: ""; position: absolute; top: 6px; left: 6px; width: 52px; height: 52px;
  border: 1px solid var(--gold); transform: rotate(45deg); pointer-events: none;
}
.steps li b { font: 400 19px var(--f-display); color: var(--gold); }
.steps li span { color: var(--muted); font-size: 15px; }
.dl-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; justify-content: center; }
.note { margin: 22px auto 0; max-width: 46em; text-align: center; color: var(--muted); font-size: 14px; }

/* Register */
.reg-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.reg-text { min-width: 0; }
.ticks { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; }
.ticks li::before { content: "✦"; color: var(--gold); margin-right: 10px; }
.reg-form { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 14px; color: var(--muted); letter-spacing: .06em; }
.field input {
  width: 100%; padding: 11px 12px; font: 400 16px var(--f-body); color: var(--parch);
  background: #0c0907; border: 1px solid #5b4527; border-radius: 0;
}
.field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.field input[aria-invalid="true"] { border-color: var(--blood); }
.err { color: #e0705f; min-height: 0; font-size: 13px; }
.err:empty { display: none; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--gold); width: 18px; height: 18px; flex: none; }
.form-msg { margin: 0; padding: 10px 12px; border: 1px solid var(--bronze); background: #d6b06614; font-size: 15px; }
.form-msg.bad { border-color: var(--blood); background: #a3362a1f; }

/* Rules */
.rules { display: grid; gap: 0; border-top: 1px solid #4a392099; }
.rules details { border-bottom: 1px solid #4a392099; }
.rules summary {
  cursor: pointer; list-style: none; padding: 16px 4px; display: flex; justify-content: space-between; gap: 12px;
  font: 400 19px var(--f-display); color: var(--parch); letter-spacing: .03em;
}
.rules summary::-webkit-details-marker { display: none; }
.rules summary::after { content: "+"; color: var(--gold); font-size: 22px; line-height: 1; }
.rules details[open] summary::after { content: "−"; }
.rules details[open] summary { color: var(--gold-hi); }
.rules p { margin: 0 4px 18px; color: var(--muted); }

/* Contacts */
.contacts { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.contact {
  display: flex; align-items: center; gap: 14px; min-width: 0; flex: 0 1 300px;
  padding: 16px 18px; border: 1px solid var(--bronze); background: #0f0b08; text-decoration: none; color: var(--parch);
}
.contact:hover { border-color: var(--gold); color: var(--parch); }
.contact i { font-style: normal; width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 1px solid var(--gold); color: var(--gold); font: 400 15px var(--f-display); }
.contact b { display: block; font: 400 17px var(--f-display); color: var(--gold-hi); }
.contact small { color: var(--muted); word-break: break-all; }
.contact.tbd { opacity: .65; pointer-events: none; }

/* Footer */
.foot { padding-block: 32px calc(32px + env(safe-area-inset-bottom, 0px)); background: #0b0806; text-align: center; color: var(--muted); }
.foot-in p { margin: 4px 0; }
.foot b { color: var(--gold); font-family: var(--f-display); font-weight: 400; }
.small { font-size: 13px; max-width: 52em; margin-inline: auto !important; }

.to-top {
  position: fixed; z-index: 40;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border: 1px solid var(--gold); background: #120d09e6; color: var(--gold); cursor: pointer; font-size: 14px;
}

/* Responsive */
@media (max-width: 1000px) {
  .ev-cards { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr 1fr; }
  .two-col > :last-child { grid-column: 1 / -1; }
  .steps { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .burger { display: block; }
  .nav {
    position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0;
    background: #140f0b; border-bottom: 1px solid var(--bronze);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    display: none;
  }
  .nav.open { display: flex; }
  .nav a { padding: 12px 6px; border-bottom: 1px solid #4a392055; font-size: 17px; }
  .lang { margin: 12px 0 0; align-self: flex-start; }
  .lang button { padding: 10px 16px; }
  .server-grid, .reg-wrap, .sch-grid, .chests { grid-template-columns: 1fr; }
  .features { grid-template-columns: repeat(2, 1fr); }
  .status { grid-template-columns: repeat(2, 1fr); }
  .status-cell.wide { grid-column: 1 / -1; border-right: 0; border-top: 1px solid #4a392080; align-items: center; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .hero-in { padding-block: 48px 40px; }
  .sec { padding-block: 52px; }
  .features, .steps, .ev-cards, .two-col, .chests { grid-template-columns: 1fr; }
  .timeline li { grid-template-columns: 6.6em 1fr; }
  .price-tbl th, .price-tbl td { white-space: normal; padding: 8px 4px; }
  .price-tbl td { font-size: 17px; }
  .status-cell { padding: 12px 10px; }
  .num, .countdown { font-size: 19px; }
  .countdown { white-space: normal; text-align: center; }
  .pill { font-size: 14px; }
  .reg-wrap { gap: 28px; }
  .hero-cta .btn { flex: 1 1 100%; }
  .sec-title { gap: 10px; }
  .sec-title::before, .sec-title::after { flex-basis: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<!--BODY-START-->
<aside class="demo-ribbon" id="demoRibbon" aria-label="Demo" hidden><span data-i18n="demo"></span></aside>

<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="#home">
      <span class="logo-mark" aria-hidden="true">✦</span>
      <span class="logo-text"><b data-cfg="serverName"></b><small data-cfg="chronicle"></small></span>
    </a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    <nav class="nav" id="nav">
      <a href="#server" data-i18n="nav.server"></a>
      <a href="#schedule" data-i18n="nav.schedule"></a>
      <a href="#pvp" data-i18n="nav.pvp"></a>
      <a href="#premium" data-i18n="nav.premium"></a>
      <a href="#start" data-i18n="nav.start"></a>
      <a href="#rules" data-i18n="nav.rules"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
      <div class="lang" role="group" aria-label="Til / Язык">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <canvas class="embers" id="embers" aria-hidden="true"></canvas>
    <div class="wrap hero-in">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 class="hero-title"><span data-cfg="serverName"></span></h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <div class="hero-cta">
        <a class="btn btn-gold" href="#start" data-i18n="cta.play"></a>

/* Server time (UTC+5, no DST) */
function serverNow() {
  const d = new Date(Date.now() + CONFIG.tzOffset * 3600e3);
  return { ms: d.getTime(), wd: ((d.getUTCDay() + 6) % 7) + 1, h: d.getUTCHours(), m: d.getUTCMinutes(), s: d.getUTCSeconds(), dayStart: Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) };
}
const toMin = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };

function evName(e, wd) {
  if (e.ev === "boss") return t("ev.boss") + ": " + CONFIG.bosses[wd];
  if (e.ev === "siege") return t("ev.siege") + ": " + CONFIG.sieges[wd];
  return t("ev." + e.ev);
}

function dayEvents(wd) {
  const l = CONFIG.daily.filter((e) => e.ev !== "reset" && !(e.noSun && wd === 7) && !(e.ev === "siege" && !CONFIG.sieges[wd]));
  return (wd === 1 ? CONFIG.monday.concat(l) : l).slice().sort((a, b) => toMin(a.t) - toMin(b.t));
}

/* Running event (if any) or the next one, within 8 days */
function nextEvent() {
  const n = serverNow();
  for (let k = 0; k < 8; k++) {
    const wd = ((n.wd - 1 + k) % 7) + 1, base = n.dayStart + k * 86400e3;
    for (const e of dayEvents(wd)) {
      const start = base + toMin(e.t) * 60e3;
      const end = e.end ? base + toMin(e.end) * 60e3 : e.min ? start + e.min * 60e3 : start;
      if (k === 0 && n.ms >= start && n.ms < end) return { name: evName(e, wd), running: true, ms: end - n.ms };
      if (start > n.ms) return { name: evName(e, wd), running: false, ms: start - n.ms };
    }
  }
  return null;
}

let lastDay = 0;
function tick() {
  const n = serverNow();
  $("stClock").textContent = `${pad(n.h)}:${pad(n.m)}:${pad(n.s)}`;
  if (lastDay && lastDay !== n.wd) { lastDay = n.wd; render(); return; }
  lastDay = n.wd;
  const e = nextEvent();
  if (!e) return;
  const s = Math.floor(e.ms / 1000);
  $("nextName").textContent = e.name;
  $("nextName").previousElementSibling.textContent = t(e.running ? "status.now" : "status.next");
  const hms = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  $("countdown").textContent = e.running ? `${t("status.left")} ${hms}` : hms;
}

/* Registration form */
function setErr(inputId, errId, msg) {
  $(errId).textContent = msg || "";
  if (inputId) $(inputId).setAttribute("aria-invalid", msg ? "true" : "false");
  return !msg;
}

async function onSubmit(e) {
  e.preventDefault();
  const login = $("regLogin").value.trim(), email = $("regEmail").value.trim();
  const pass = $("regPass").value, pass2 = $("regPass2").value;
  const ok = [
    setErr("regLogin", "errLogin", /^[A-Za-z0-9]{4,14}$/.test(login) ? "" : t("err.login")),
    setErr("regEmail", "errEmail", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : t("err.email")),
    setErr("regPass", "errPass", pass.length >= 6 && pass.length <= 16 ? "" : t("err.pass")),
    setErr("regPass2", "errPass2", pass2 === pass && pass2 ? "" : t("err.pass2")),
    setErr(null, "errRules", $("regRules").checked ? "" : t("err.rules"))
  ].every(Boolean);
  const msg = $("regMsg");
  msg.hidden = true; msg.className = "form-msg";
  if (!ok) { document.querySelector('#regForm [aria-invalid="true"]')?.focus(); return; }

  if (!CONFIG.registerApi) { msg.textContent = t("reg.offline"); msg.hidden = false; return; }
  const btn = e.submitter || document.querySelector("#regForm button[type=submit]");
  btn.disabled = true;
  try {
    const r = await fetch(CONFIG.registerApi, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login, email, password: pass }) });
    if (!r.ok) throw new Error(r.status);
    msg.textContent = t("reg.ok"); e.target.reset();
  } catch (err) {
    msg.textContent = t("reg.fail"); msg.classList.add("bad");
  } finally {
    msg.hidden = false; btn.disabled = false;
  }
}

/* Hero: castle silhouette + rising embers */
function embers() {
  const cv = $("embers"), ctx = cv.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, parts = [], dpr = 1;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, w / 14));
    parts = Array.from({ length: n }, () => spawn(true));
  }
  function spawn(any) {
    return { x: Math.random() * w, y: any ? Math.random() * h : h + 10, r: Math.random() * 1.8 + .6, v: Math.random() * .5 + .25, a: Math.random() * Math.PI * 2, life: Math.random() * .6 + .4 };
  }
  function castle() {
    const base = h - 18, s = Math.min(1, w / 1100);
    ctx.fillStyle = "#0a0705";
    ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, base - 10);
    // hills
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, base - 14 - Math.sin(x / 140) * 10 - Math.sin(x / 47) * 4);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    // keep with towers, drawn around center-right
    const cx = w * .72, tw = 26 * s + 10;
    const towers = [[-5, 90], [-3.4, 120], [-1.6, 70], [0, 160], [1.6, 82], [3.2, 128], [4.8, 96]];
    towers.forEach(([o, th]) => {
      const x = cx + o * tw * 1.05, top = base - 20 - th * s;
      ctx.fillRect(x - tw / 2, top, tw, base - top);
      for (let k = 0; k < 3; k++) ctx.fillRect(x - tw / 2 + k * tw / 2.5, top - 7 * s - 3, tw / 5, 7 * s + 3);
      if (th > 110) { ctx.beginPath(); ctx.moveTo(x - tw / 2 - 3, top - 6); ctx.lineTo(x, top - 46 * s - 14); ctx.lineTo(x + tw / 2 + 3, top - 6); ctx.fill(); }
    });
    ctx.fillRect(cx - 5 * tw * 1.05, base - 60 * s - 10, 9.8 * tw * 1.05, 60 * s + 30);
    // lit windows
    ctx.fillStyle = "#e0a84a";
    [[-3.4, 70], [0, 110], [0, 80], [3.2, 85], [1.6, 50]].forEach(([o, y]) => ctx.fillRect(cx + o * tw * 1.05 - 2, base - y * s - 10, 4, 7));
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    parts.forEach((p, i) => {
      p.y -= p.v; p.a += .02; p.x += Math.sin(p.a) * .3;
      const fade = Math.max(0, Math.min(1, p.y / h)) * p.life;
      ctx.fillStyle = `rgba(240,170,80,${fade.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.y < -10) parts[i] = spawn(false);
    });
    castle();
    if (!still) requestAnimationFrame(frame);
  }
  size(); frame();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); if (still) frame(); }, 150); });
}

function init() {
  render();
  setInterval(tick, 1000);
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("ego900-lang", lang); } catch (e) {}
    render();
    document.querySelectorAll(".err").forEach((n) => { n.textContent = ""; });
    document.querySelectorAll("#regForm [aria-invalid]").forEach((n) => n.removeAttribute("aria-invalid"));
    $("regMsg").hidden = true;
  }));

  const burger = $("burger"), nav = $("nav");
  burger.addEventListener("click", () => {
    const open = !nav.classList.contains("open");
    nav.classList.toggle("open", open); burger.setAttribute("aria-expanded", String(open));
  });
  nav.addEventListener("click", (e) => {
    if (e.target.closest("a")) { nav.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); }
  });

  $("regForm").addEventListener("submit", onSubmit);

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const done = () => { b.textContent = t("copied"); setTimeout(() => { b.textContent = t("copy"); }, 1500); };
    navigator.clipboard?.writeText(b.dataset.copy).then(done, () => {
      const s = b.parentElement.querySelector(".sel"); const r = document.createRange(); r.selectNodeContents(s);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
  });

  const toTop = $("toTop");
  toTop.addEventListener("click", () => window.scrollTo({ top: 0 }));
  const links = [...nav.querySelectorAll("a")];
  const onScroll = () => {
    toTop.hidden = window.scrollY < 600;
    let cur = "";
    links.forEach((a) => { const s = document.querySelector(a.getAttribute("href")); if (s && s.getBoundingClientRect().top < 120) cur = a.getAttribute("href"); });
    links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === cur));
  };
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  embers();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
</script>
</body>
